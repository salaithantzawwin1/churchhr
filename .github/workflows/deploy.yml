name: Deploy to Cloudflare Workers

# Every push to main applies pending D1 migrations before deploying the Worker,
# so code cannot ship ahead of the schema. Cloudflare Workers Builds is also
# connected to main: keep its build command applying migrations too, or
# disconnect it, so production has a single migration-first deploy path.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations (remote)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply church-members-db --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify production health
        run: |
          set -euo pipefail
          expected_version=$(sed -n 's/.*APP_VERSION = "\([^"]*\)".*/\1/p' src/version.ts)
          expected_migration=$(basename "$(ls migrations/*.sql | sort | tail -n 1)")
          echo "Expecting version $expected_version and migration $expected_migration"
          for attempt in $(seq 1 12); do
            body=$(curl -fsS --max-time 10 https://www.mmgoodnewshr.online/healthz || true)
            echo "$body"
            if printf '%s' "$body" | grep -q "\"version\":\"$expected_version\"" \
              && printf '%s' "$body" | grep -q "\"migration\":\"$expected_migration\"" \
              && printf '%s' "$body" | grep -q '"db":"ok"'; then
              echo "Production health probe passed"
              exit 0
            fi
            sleep 5
          done
          echo "Production health probe failed: expected $expected_version / $expected_migration with db ok" >&2
          exit 1
